<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — The Unfinished Story</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#FBF8F1" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #FBF8F1;
            color: #1F1A14;
            font-family: 'Lora', Georgia, serif;
            padding: 2rem;
            text-align: center;
        }
        .frame {
            max-width: 480px;
        }
        .fleuron {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: #8B6F3F;
            letter-spacing: 0.6em;
            padding-left: 0.6em;
            margin-bottom: 2rem;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        p {
            font-size: 1rem;
            line-height: 1.75;
            color: #4A423C;
            margin-bottom: 1rem;
            font-style: italic;
        }
        .quote {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(28, 26, 23, 0.12);
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #8B6F3F;
            font-size: 0.95rem;
        }
        a {
            color: #8B6F3F;
            text-decoration: none;
            border-bottom: 1px solid #8B6F3F;
        }
    </style>
</head>
<body>
    <div class="frame">
        <div class="fleuron">❦</div>
        <h1>You are offline</h1>
        <p>The page you were reading is not available right now. Please check your connection.</p>
        <p>If you had read chapters before, they may still be available from the <a href="/book">book</a>.</p>
        <div class="quote">"Some stories can wait. Yours will be here when you return."</div>
    </div>
</body>
</html>
