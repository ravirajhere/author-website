name: Generate Book PDFs

on:
  push:
    branches: [main]
    paths:
      - 'content/chapters/**'
      - 'data/chapters.json'
      - 'data/config.json'
      - 'templates/print.html'
      - 'css/print.css'
      - 'js/print.js'
      - 'scripts/generate-pdf.cjs'
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Generate PDFs
        run: npm run generate-pdf

      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pdfs/
          git diff --staged --quiet || git commit -m "chore: regenerate book PDFs [skip ci]"
          git push