 name: Generate Book PDFs

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'book.html'
      - 'print.html'
      - 'css/print.css'
      - 'js/print.js'
      - 'assets/images/**'

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Start local HTTP server
        run: |
          python3 -m http.server 8080 &
          sleep 2
          curl -s -I http://localhost:8080/print.html | head -1

      - name: Generate PDFs
        run: npm run generate-pdf
        env:
          PRINT_URL: http://localhost:8080

      - name: Commit PDFs back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pdfs/
          git diff --staged --quiet || git commit -m "chore: auto-generate book PDFs [skip ci]"
          git push

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: book-pdfs
          path: assets/pdfs/*.pdf
          retention-days: 90
