name: Build Site

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'content/**'
      - 'templates/**'
      - 'css/**'
      - 'js/**'
      - 'scripts/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Generate sitemap
        run: node scripts/generate-sitemap.cjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7