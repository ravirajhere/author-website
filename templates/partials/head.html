<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>{{page.title}} — {{site.title}}</title>
<meta name="description" content="{{page.description}}" />
<meta name="author" content="{{author.name}}" />
<meta name="theme-color" content="{{brand.colors.base}}" />
<link rel="canonical" href="{{site.url}}{{page.path}}" />

<meta name="robots" content="{{page.robots}}" />
<meta name="geo.region" content="IN-BR" />
<meta name="geo.placename" content="{{author.location}}" />

<!-- Open Graph -->
<meta property="og:type" content="{{page.ogType}}" />
<meta property="og:title" content="{{page.title}} — {{site.title}}" />
<meta property="og:description" content="{{page.description}}" />
<meta property="og:url" content="{{site.url}}{{page.path}}" />
<meta property="og:image" content="{{site.url}}/assets/images/{{page.ogImage}}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:site_name" content="{{site.title}}" />

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{page.title}} — {{site.title}}" />
<meta name="twitter:description" content="{{page.description}}" />
<meta name="twitter:image" content="{{site.url}}/assets/images/{{page.ogImage}}" />

<!-- Favicon -->
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="apple-touch-icon" href="/assets/favicon.png" />

<!-- PWA -->
<link rel="manifest" href="/manifest.json" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<!-- Styles -->
<link rel="stylesheet" href="/css/theme.css" />
<link rel="stylesheet" href="/css/style.css" />

<!-- Schema.org -->
<script type="application/ld+json">
{{page.schema}}
</script>
